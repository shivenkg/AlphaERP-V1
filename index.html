    <script>
      // Gracefully prevent benign HMR WebSocket disconnects from throwing unhandled rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason || event.detail);
        var msg = (reason && (reason.message || reason)) ? String(reason.message || reason) : '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('ws:') || msg.includes('wss:')) {
          event.preventDefault();
        }
      });
    </script>
