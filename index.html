    <script>
      (function() {
        // Prevent benign HMR WebSocket disconnects / tab suspensions from logging unhandled rejections
        function isViteWsError(target) {
          if (!target) return false;
          var msg = (target && (target.message || target.reason || target)) ? String(target.message || target.reason || target) : '';
          var lower = msg.toLowerCase();
          return lower.includes('websocket closed') ||
                 lower.includes('failed to connect to websocket') ||
                 lower.includes('without opened') ||
                 lower.includes('vite-hmr');
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason) || isViteWsError(event.detail)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
